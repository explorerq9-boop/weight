<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3faf7">
<title>轻轻 · 体重日记</title>
<style>
  :root{
    /* 薄荷绿主题（变量名沿用 rose = 主色） */
    --bg1:#f3faf7; --bg2:#eef7f6;
    --card:rgba(255,255,255,.74); --card-solid:#fff;
    --fg:#34494a; --sub:#8fa5a2; --faint:#e3f0ec;
    --rose:#4fbf9f; --rose-soft:#d5f0e6; --lav:#8fd3d8; --peach:#b9e6a8;
    --blob2:#dff3f5;
    --down:#2f9e86; --down-bg:#dcf2ea; --up:#e8977a; --up-bg:#fcece4;
    --glow:rgba(79,191,159,.2);
    --shadow:0 2px 6px rgba(90,170,150,.06),0 12px 40px rgba(90,170,150,.12);
    --num:ui-rounded,"SF Pro Rounded","Nunito","Avenir Next",-apple-system,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg1:#16201f; --bg2:#141c1f; --card:rgba(34,48,47,.7); --card-solid:#22302f;
      --fg:#e4f3ef; --sub:#86a09b; --faint:#2b3c3a; --rose:#62d1b0; --rose-soft:#244139;
      --blob2:#1d3236; --down:#5cc9a7; --down-bg:#20392f; --up-bg:#3d2b25; --shadow:0 12px 40px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{min-height:100%;background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%) fixed}
  body{color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
       display:flex;justify-content:center;padding:28px 18px 40px;-webkit-font-smoothing:antialiased;min-height:100vh;position:relative;overflow-x:hidden}
  /* 背景柔光 */
  body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(60px);z-index:-1;opacity:.55}
  body::before{width:320px;height:320px;background:var(--rose-soft);top:-80px;right:-60px}
  body::after{width:280px;height:280px;background:var(--blob2);bottom:-60px;left:-80px;opacity:.45}

  main{width:100%;max-width:440px}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

  /* 头部 */
  header{display:flex;justify-content:space-between;align-items:flex-end;padding:0 4px 18px}
  .hello{font-size:22px;font-weight:600;letter-spacing:.5px}
  .hello small{display:block;font-size:13px;font-weight:400;color:var(--sub);letter-spacing:0;margin-bottom:2px}
  .logo{font-size:12px;color:var(--sub);letter-spacing:2px}

  .card{background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
        border-radius:28px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.6)}
  @media (prefers-color-scheme: dark){ .card{border-color:rgba(255,255,255,.04)} }

  /* 记录卡片 */
  .entry{padding:16px 16px 22px;text-align:center}
  .nav{display:flex;align-items:center;justify-content:space-between}
  .nav .arrow{width:34px;height:34px;border-radius:50%;color:var(--sub);display:grid;place-items:center;transition:.2s}
  .nav .arrow:hover{background:var(--faint);color:var(--fg)}
  .nav .arrow:disabled{opacity:0;pointer-events:none}
  .nav .arrow svg{width:16px;height:16px}
  .date{font-size:14px;color:var(--sub)}
  .date b{color:var(--fg);font-weight:500}
  .today-btn{display:block;margin:2px auto 0;font-size:11px;color:var(--rose);padding:1px 10px;border-radius:99px;background:var(--rose-soft)}

  .scale{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px}
  .step{width:40px;height:40px;border-radius:50%;background:var(--faint);color:var(--rose);font-size:22px;line-height:1;
        display:grid;place-items:center;transition:transform .15s,background .2s;flex-shrink:0}
  .step:hover{background:var(--rose-soft)}
  .step:active{transform:scale(.88)}
  .num{position:relative;display:flex;align-items:baseline;justify-content:center}
  #w{width:3.6em;font:500 60px/1.1 var(--num);text-align:center;border:none;background:none;color:var(--fg);outline:none;
     font-variant-numeric:tabular-nums;letter-spacing:-1px;caret-color:var(--rose);padding:0}
  #w::placeholder{color:var(--faint)}
  #w::-webkit-outer-spin-button,#w::-webkit-inner-spin-button{-webkit-appearance:none}
  #w{-moz-appearance:textfield}
  .unit{position:absolute;right:-18px;bottom:12px;color:var(--sub);font-size:14px}

  .chip{display:inline-flex;align-items:center;gap:4px;margin-top:12px;padding:4px 12px;border-radius:99px;
        font-size:12.5px;color:var(--sub);background:var(--faint);min-height:26px;transition:.3s}
  .chip.down{color:var(--down);background:var(--down-bg)}
  .chip.up{color:var(--up);background:var(--up-bg)}
  .chip.ok{color:var(--rose);background:var(--rose-soft)}
  .chip .n{font-family:var(--num);font-weight:600}
  .pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
  @keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}

  /* 趋势卡片 */
  .trend{margin-top:16px;padding:18px 16px 14px}
  .tabs{display:flex;gap:4px;background:var(--faint);border-radius:99px;padding:3px}
  .tabs button{flex:1;padding:6px 0;border-radius:99px;font-size:12.5px;color:var(--sub);transition:.25s}
  .tabs button.on{background:var(--card-solid);color:var(--rose);font-weight:500;box-shadow:0 2px 8px var(--glow)}

  .summary{display:flex;align-items:flex-end;justify-content:space-between;margin:20px 4px 4px}
  .big .k{font-size:12px;color:var(--sub)}
  .big .v{font:600 30px/1.2 var(--num);letter-spacing:-.5px}
  .big .v small{font-size:14px;font-weight:500;margin-left:2px;color:var(--sub)}
  .big .v.down{color:var(--down)} .big .v.up{color:var(--up)}
  .msg{font-size:12px;color:var(--sub);text-align:right;max-width:55%}

  svg{display:block;width:100%;height:200px;overflow:visible;touch-action:pan-y;margin-top:8px}
  .grid{stroke:var(--faint);stroke-width:1;stroke-dasharray:2 4}
  .axis{fill:var(--sub);font-size:10px;font-family:var(--num)}
  .ln{fill:none;stroke:url(#stroke);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  .avg{fill:none;stroke:var(--lav);stroke-width:1.4;stroke-dasharray:1 4;stroke-linecap:round;opacity:.9}
  .dot{fill:var(--card-solid);stroke:var(--rose);stroke-width:1.8}
  .sel{stroke:var(--rose);stroke-width:1;stroke-dasharray:3 3;opacity:.5}
  .empty{fill:var(--sub);font-size:13px}
  .tipbox{fill:var(--card-solid);filter:drop-shadow(0 3px 8px var(--glow))}
  .tip{fill:var(--fg);font-size:11px;font-family:var(--num);font-weight:600}

  .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .mini div{background:var(--faint);border-radius:16px;padding:8px 0;text-align:center}
  .mini .k{font-size:11px;color:var(--sub)}
  .mini .v{font:600 16px/1.3 var(--num);font-variant-numeric:tabular-nums}
  .legend{display:flex;justify-content:center;gap:14px;font-size:11px;color:var(--sub);margin-top:12px}
  .legend i{display:inline-block;width:14px;height:0;vertical-align:middle;margin-right:4px;border-top:2.5px solid var(--rose);border-radius:2px}
  .legend i.a{border-top:2px dotted var(--lav)}

  footer{text-align:center;margin-top:22px;font-size:12px;color:var(--sub)}
  footer button{color:var(--sub);font-size:12px;padding:4px 10px;border-radius:99px}
  footer button:hover{background:var(--card);color:var(--fg)}
</style>
</head>
<body>
<main>
  <header>
    <div class="hello"><small id="greetSub"></small><span id="greet"></span></div>
    <div class="logo">轻 轻</div>
  </header>

  <section class="card entry">
    <div class="nav">
      <button class="arrow" id="prev" aria-label="前一天"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 3 5 8l5 5"/></svg></button>
      <div class="date"><span id="dateTxt"></span><button class="today-btn" id="toToday" hidden>回到今天</button></div>
      <button class="arrow" id="next" aria-label="后一天"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 3 5 5-5 5"/></svg></button>
    </div>
    <div class="scale">
      <button class="step" id="minus" aria-label="减 0.1">−</button>
      <div class="num">
        <input id="w" type="number" inputmode="decimal" step="0.1" min="20" max="300" placeholder="00.0" autocomplete="off">
        <span class="unit">kg</span>
      </div>
      <button class="step" id="plus" aria-label="加 0.1">+</button>
    </div>
    <div class="chip" id="delta"></div>
  </section>

  <section class="card trend">
    <div class="tabs" id="tabs">
      <button data-r="7">一周</button>
      <button data-r="30">一个月</button>
      <button data-r="90">三个月</button>
      <button data-r="all">全部</button>
    </div>
    <div class="summary">
      <div class="big"><div class="k">这段时间</div><div class="v" id="sChange">–</div></div>
      <div class="msg" id="msg"></div>
    </div>
    <svg id="chart"></svg>
    <div class="mini">
      <div><div class="k">最轻</div><div class="v" id="sMin">–</div></div>
      <div><div class="k">平均</div><div class="v" id="sAvg">–</div></div>
      <div><div class="k">记录</div><div class="v" id="sCnt">–</div></div>
    </div>
    <div class="legend"><span><i></i>每日体重</span><span><i class="a"></i>7 日趋势</span></div>
  </section>

  <footer>
    <button id="exp">导出备份</button>·<button id="imp">导入</button>
    <input type="file" id="file" accept=".json" hidden>
  </footer>
</main>

<script>
const KEY = 'weight-log-v1';
let data = JSON.parse(localStorage.getItem(KEY) || '{}');
let range = localStorage.getItem(KEY + '-range') || '30';
if (!['7','30','90','all'].includes(range)) range = '30';
const $ = id => document.getElementById(id);

/* ---------- 工具 ---------- */
const pad = n => String(n).padStart(2, '0');
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const add = (k, n) => { const d = parse(k); d.setDate(d.getDate() + n); return fmt(d); };
const diff = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const today = () => fmt(new Date());
const WEEK = '日一二三四五六';
let cur = today();

const save = () => localStorage.setItem(KEY, JSON.stringify(data));
const keys = () => Object.keys(data).sort();
const f1 = v => v.toFixed(1);
const signed = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1);
const cls = v => v < -0.05 ? 'down' : v > 0.05 ? 'up' : '';
const prevKey = k => keys().filter(x => x < k).pop();

/* ---------- 问候 ---------- */
function greet() {
  const h = new Date().getHours();
  const [t, s] = h < 5 ? ['夜深啦', '早点休息哦 🌙'] : h < 11 ? ['早上好', '空腹称一下吧 ☀️'] :
                 h < 14 ? ['中午好', '记得好好吃饭 🍃'] : h < 18 ? ['下午好', '喝杯水休息一下 🫖'] : ['晚上好', '今天也辛苦啦 🌷'];
  $('greet').textContent = t; $('greetSub').textContent = s;
}

/* ---------- 记录区 ---------- */
function renderEntry(keepInput) {
  const d = parse(cur), off = diff(cur, today());
  const label = off === 0 ? '今天' : off === 1 ? '昨天' : off === 2 ? '前天' : '';
  $('dateTxt').innerHTML = `<b>${d.getMonth() + 1}月${d.getDate()}日</b> 周${WEEK[d.getDay()]}${label ? ' · ' + label : ''}`;
  $('toToday').hidden = off === 0;
  $('next').disabled = off <= 0;
  if (!keepInput) $('w').value = data[cur] != null ? f1(data[cur]) : '';
  renderChip();
}

function renderChip(flash) {
  const el = $('delta'); el.className = 'chip';
  if (flash) { el.className = 'chip ok pop'; el.textContent = flash; return; }
  const v = data[cur], p = prevKey(cur);
  if (v == null) { el.innerHTML = p ? `上次 <span class="n">${f1(data[p])}</span> kg · 点 ± 或直接输入` : '输入体重，按回车保存 ♡'; return; }
  if (!p) { el.textContent = '第一条记录，开始啦 ✨'; return; }
  const dd = v - data[p], gap = diff(p, cur), c = cls(dd);
  el.classList.add(c || 'x');
  el.innerHTML = `${gap === 1 ? '比昨天' : `比 ${gap} 天前`} <span class="n">${c ? signed(dd) + ' kg' : '持平'}</span>`;
}

let flashT;
function commit() {
  const raw = $('w').value.trim(), old = data[cur];
  if (raw === '') { if (old == null) return; delete data[cur]; }
  else {
    const v = Math.round(parseFloat(raw) * 10) / 10;
    if (!(v > 20 && v < 300) || v === old) return;
    data[cur] = v; $('w').value = f1(v);
  }
  save(); render(true);
  renderChip(raw === '' ? '已删除' : '记下啦 ♡');
  clearTimeout(flashT); flashT = setTimeout(() => renderChip(), 1300);
}

let stepT;
function step(dv) {
  const base = parseFloat($('w').value) || data[prevKey(cur)] || 50;
  $('w').value = f1(Math.round((base + dv) * 10) / 10);
  clearTimeout(stepT); stepT = setTimeout(commit, 700);
}

function go(k) {
  if (k > today()) return;
  cur = k; render();
  if (matchMedia('(hover:hover)').matches) { $('w').focus(); $('w').select(); }
}

/* ---------- 趋势区 ---------- */
function period() {
  const end = today(), all = keys();
  let start = range === 'all' ? (all[0] || end) : add(end, -(+range - 1));
  if (diff(start, end) < 6) start = add(end, -6);
  return { start, end, pts: all.filter(k => k >= start && k <= end) };
}

function renderStats({ pts }) {
  const vs = pts.map(k => data[k]);
  $('sCnt').textContent = vs.length ? vs.length + ' 天' : '–';
  if (!vs.length) {
    ['sChange', 'sAvg', 'sMin'].forEach(i => $(i).textContent = '–'); $('sChange').className = 'v';
    $('msg').textContent = '还没有记录，从今天开始吧'; return;
  }
  $('sAvg').textContent = f1(vs.reduce((a, b) => a + b, 0) / vs.length);
  $('sMin').textContent = f1(Math.min(...vs));
  if (vs.length < 2) { $('sChange').innerHTML = '–'; $('sChange').className = 'v'; $('msg').textContent = '再多记几天就能看到变化啦'; return; }
  const ch = vs.at(-1) - vs[0], c = cls(ch);
  $('sChange').className = 'v ' + c;
  $('sChange').innerHTML = (c ? signed(ch) : '0.0') + '<small>kg</small>';
  $('msg').textContent = c === 'down' ? '一点点在变轻，好棒 ✨' : c === 'up' ? '小小波动很正常，看趋势就好 🌷' : '稳稳的，保持住 ☁️';
}

// 平滑曲线（不过冲）
const smooth = ps => ps.map((p, i) => {
  if (!i) return `M${p[0].toFixed(1)},${p[1].toFixed(1)}`;
  const q = ps[i - 1], mx = (q[0] + p[0]) / 2;
  return `C${mx.toFixed(1)},${q[1].toFixed(1)} ${mx.toFixed(1)},${p[1].toFixed(1)} ${p[0].toFixed(1)},${p[1].toFixed(1)}`;
}).join('');

let chartPts = [];
function renderChart({ start, end, pts }) {
  const svg = $('chart'), W = svg.clientWidth || 400, H = 200;
  const L = 30, R = 8, T = 26, B = 22, days = diff(start, end);
  const X = k => L + (diff(start, k) / days) * (W - L - R);
  let h = `<defs>
    <linearGradient id="stroke" x1="0" x2="1"><stop offset="0" stop-color="var(--peach)"/><stop offset=".5" stop-color="var(--rose)"/><stop offset="1" stop-color="var(--lav)"/></linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--rose)" stop-opacity=".22"/><stop offset="1" stop-color="var(--rose)" stop-opacity="0"/></linearGradient>
  </defs>`;
  if (!pts.length) {
    svg.innerHTML = h + `<text class="empty" x="${W / 2}" y="${H / 2}" text-anchor="middle">🌱 这段时间还没有记录</text>`;
    chartPts = []; return;
  }
  const vs = pts.map(k => data[k]);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  const pv = Math.max((hi - lo) * 0.25, 0.5);
  lo = Math.floor((lo - pv) * 2) / 2; hi = Math.ceil((hi + pv) * 2) / 2;
  const Y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);

  for (let i = 0; i <= 3; i++) {
    const v = lo + (hi - lo) * i / 3, y = Y(v);
    h += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="axis" x="${L - 6}" y="${y + 3}" text-anchor="end">${f1(v)}</text>`;
  }
  [start, add(start, Math.round(days / 2)), end].forEach((k, i) => {
    const d = parse(k);
    h += `<text class="axis" x="${X(k)}" y="${H - 4}" text-anchor="${['start', 'middle', 'end'][i]}">${d.getMonth() + 1}/${d.getDate()}</text>`;
  });
  if (cur >= start && cur <= end) h += `<line class="sel" x1="${X(cur)}" x2="${X(cur)}" y1="${T - 6}" y2="${H - B}"/>`;

  chartPts = pts.map(k => ({ k, v: data[k], x: X(k), y: Y(data[k]) }));
  const xy = chartPts.map(p => [p.x, p.y]);
  if (xy.length > 1) {
    const line = smooth(xy);
    h += `<path fill="url(#fill)" d="${line}L${xy.at(-1)[0]},${H - B}L${xy[0][0]},${H - B}Z"/>`;
    if (xy.length >= 4) {
      const all = keys();
      const avg = chartPts.map(p => {
        const w = all.filter(k => k <= p.k && k > add(p.k, -7)).map(k => data[k]);
        return [p.x, Y(w.reduce((a, b) => a + b, 0) / w.length)];
      });
      h += `<path class="avg" d="${smooth(avg)}"/>`;
    }
    h += `<path class="ln" d="${line}"/>`;
  }
  const many = chartPts.length > 40;
  chartPts.forEach((p, i) => {
    const sel = p.k === cur;
    if (many && !sel && i !== chartPts.length - 1) return;
    h += sel ? `<circle cx="${p.x}" cy="${p.y}" r="9" fill="var(--rose)" opacity=".15"/><circle cx="${p.x}" cy="${p.y}" r="4.5" fill="var(--rose)" stroke="var(--card-solid)" stroke-width="2"/>`
             : `<circle class="dot" cx="${p.x}" cy="${p.y}" r="3"/>`;
  });
  h += `<g id="hover"></g><rect x="0" y="0" width="${W}" height="${H}" fill="transparent" id="hit" style="cursor:pointer"/>`;
  svg.innerHTML = h;
  bindHover(W);
}

function nearest(e) {
  const r = $('chart').getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
  return chartPts.reduce((b, p) => !b || Math.abs(p.x - x) < Math.abs(b.x - x) ? p : b, null);
}
function bindHover(W) {
  const hit = $('hit'), g = $('hover');
  const show = e => {
    const p = nearest(e); if (!p) return;
    const d = parse(p.k), txt = `${d.getMonth() + 1}/${d.getDate()} · ${f1(p.v)}`;
    const bw = txt.length * 6.4 + 16, bx = Math.min(Math.max(p.x - bw / 2, 0), W - bw), by = Math.max(p.y - 34, -6);
    g.innerHTML = `<circle cx="${p.x}" cy="${p.y}" r="7" fill="var(--rose)" opacity=".2"/>
      <rect class="tipbox" x="${bx}" y="${by}" width="${bw}" height="22" rx="11"/>
      <text class="tip" x="${bx + bw / 2}" y="${by + 15}" text-anchor="middle">${txt}</text>`;
  };
  hit.onmousemove = show; hit.ontouchstart = show; hit.ontouchmove = show;
  hit.onmouseleave = () => g.innerHTML = '';
  hit.onclick = e => { const p = nearest(e); if (p) go(p.k); };
}

function render(keepInput) {
  greet(); renderEntry(keepInput);
  const p = period(); renderStats(p); renderChart(p);
}

/* ---------- 事件 ---------- */
$('w').addEventListener('keydown', e => {
  if (e.key === 'Enter') { commit(); $('w').select(); }
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); step(e.key === 'ArrowUp' ? .1 : -.1); }
});
$('w').addEventListener('blur', commit);
$('minus').onclick = () => step(-.1);
$('plus').onclick = () => step(.1);
$('prev').onclick = () => { commit(); go(add(cur, -1)); };
$('next').onclick = () => { commit(); go(add(cur, 1)); };
$('toToday').onclick = () => { commit(); go(today()); };
document.addEventListener('keydown', e => {
  if (!e.altKey) return;
  if (e.key === 'ArrowLeft') $('prev').click();
  if (e.key === 'ArrowRight') $('next').click();
});
$('tabs').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  range = b.dataset.r; localStorage.setItem(KEY + '-range', range);
  [...$('tabs').children].forEach(x => x.classList.toggle('on', x === b));
  render(true);
};
[...$('tabs').children].forEach(x => x.classList.toggle('on', x.dataset.r === range));

$('exp').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }));
  a.download = `体重备份-${today()}.json`; a.click();
};
$('imp').onclick = () => $('file').click();
$('file').onchange = async e => {
  try {
    const obj = JSON.parse(await e.target.files[0].text());
    Object.entries(obj).forEach(([k, v]) => { if (/^\d{4}-\d\d-\d\d$/.test(k) && +v > 0) data[k] = +v; });
    save(); render();
  } catch { alert('文件格式不太对哦'); }
  e.target.value = '';
};
addEventListener('resize', () => renderChart(period()));
document.addEventListener('visibilitychange', () => { if (!document.hidden && cur !== today() && !data[cur]) go(today()); else if (!document.hidden) greet(); });

render();
if (matchMedia('(hover:hover)').matches) $('w').focus();
</script>
</body>
</html>
